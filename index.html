<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dla Ciebie ❤️</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="hearts" aria-hidden="true"></div>

  <main class="card">
    <div class="sparkles">✦ ✧ ✦</div>

    <p class="small-text">Mam coś dla Ciebie...</p>
    <h1>❤️ Kocham Cię ❤️</h1>

    <p class="message">
      Jesteś dla mnie kimś naprawdę wyjątkowym.
      Dziękuję, że jesteś przy mnie i że mogę dzielić z Tobą
      te wszystkie małe i wielkie chwile.
    </p>

    <button id="loveButton">Kliknij mnie 💌</button>

    <p id="secretMessage" class="secret hidden">
      Wybieram Ciebie. Dzisiaj, jutro i każdego kolejnego dnia. ❤️
    </p>

    <div class="counter">
      <span>∞</span>
      <small>powodów, żeby Cię kochać</small>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
